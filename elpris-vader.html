<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elpris och väder</title>
<style>
  :root{
    --bg:#000;
    --ink:#f4f4f4;
    --dim:rgba(244,244,244,.45);
    --dimmer:rgba(244,244,244,.22);
    --ref:#ff5b5b;
    --sunrise:#ffd166;
    --sunset:#8ab4f8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;
    padding:1.2vh 1vw;overflow:hidden;
  }
  #msg{flex:0 0 auto;text-align:center;font-size:1.8vh;color:var(--dim)}
  #chart{flex:1 1 auto;min-height:0;width:100%}
  #chart svg{width:100%;height:100%;display:block}
  #wx{--wxfs:13px;flex:0 0 auto;display:flex;margin-top:.4vh}
  #wxLab{flex:0 0 auto;text-align:right;color:var(--ink)}
  #wxGrid{flex:1 1 auto;display:grid;text-align:center}
  #wxSun{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;
    gap:.35em;font-size:var(--wxfs)}
  #wxSun > div{display:flex;align-items:center;gap:.4em}
  #wxSun svg{flex:0 0 auto}
  #wx div{line-height:1.35;white-space:nowrap}
  #wxGrid > div{color:var(--ink);border-radius:3px}
  .ic{font-size:calc(var(--wxfs) * 1.55);opacity:.8}
  .tp{font-size:calc(var(--wxfs) * 1.25);font-weight:600}
  .fl{font-size:calc(var(--wxfs) * 0.95);opacity:.4}
  .sc{font-size:var(--wxfs);opacity:.65}
</style>
</head>
<body>
  <div id="msg">Hämtar data…</div>
  <div id="chart"></div>
  <div id="wx"><div id="wxLab"></div><div id="wxGrid"></div><div id="wxSun"></div></div>

<script>
(() => {
  "use strict";

  // ---- inställningar ----------------------------------------------------
  const ZONE = "SE3";          // SE1 Luleå · SE2 Sundsvall · SE3 Stockholm · SE4 Malmö
  const LAT  = 59.31;          // Nacka
  const LON  = 18.17;
  // ---- vad en kWh faktiskt kostar --------------------------------------
  // Alla belopp i öre per kWh EXKLUSIVE moms. Momsen läggs på hela summan
  // sist, precis som på fakturan. Hämta dina egna värden från elhandels-
  // respektive elnätsfakturan; noll betyder "räkna inte med posten".
  const TARIFF = {
    vat:       1.25,   // moms, 25 % i Sverige
    energyTax: 36.0,   // energiskatt 2026, 36,0 öre exkl moms (45,0 inkl)
    markup:     6,     // UPPSKATTNING – elhandlarens påslag, öre/kWh
    cert:       1,     // UPPSKATTNING – elcertifikat och ursprungsgarantier
    gridHigh:  35,     // UPPSKATTNING – överföringsavgift höglasttid
    gridLow:   13      // UPPSKATTNING – överföringsavgift låglasttid
  };
  // Höglasttid enligt Nacka Energi: vardagar 06–22 under november–mars.
  // Har din nätägare ingen tidsdifferentiering, som Vattenfall Eldistribution,
  // sätter du samma tal på gridHigh och gridLow.
  // Nätavgifterna är uppräknade från Nacka Energis publicerade 2022-nivåer
  // (8,1 och 24,2 öre) och bör bytas mot siffrorna på din egen nätfaktura.

  // Färgskalan ankras mot 3-månaderssnittet i stället för fasta belopp. Gult
  // betyder därmed alltid "normalt pris", oavsett hur stora dina fasta pålägg
  // är. Faktorerna anger var skalan bottnar och toppar i förhållande till
  // snittet, och FALLBACK används innan historiken hunnit hämtas.
  const COLOR = { low: 0.65, high: 1.8, midHue: 55, fallback: 1.40 };
  const WIN_H   = 24;          // fönstrets längd i timmar, från förra hela timmen
  const HIST_DAYS = 90;        // hur långt bak de historiska snitten räknas
  const WX_STEP = 2;           // sifferraden visar var WX_STEP:e timme
  // ----------------------------------------------------------------------

  const MS_PRICE = 15 * 60 * 1000;
  const MS_WX    = 20 * 60 * 1000;
  const MS_DRAW  = 30 * 1000;
  const HOUR     = 3600 * 1000;

  let yesterday = null, today = null, tomorrow = null, wx = null, hist = null;
  let padL = 0, padR = 0, padPitch = 0, padFirstX = 0, wxCols = [];
  let lastW = 0, lastH = 0, pending = false;
  let errPrice = "", errWx = "";

  // Felen hålls i egna variabler. Tidigare skrev draw() över väderfelet med en
  // tom sträng så fort priserna kom in, och felet försvann utan spår.
  const setMsg = () =>
    document.getElementById("msg").textContent = [errPrice, errWx].filter(Boolean).join(" · ");

  const pad2 = n => String(n).padStart(2, "0");
  const hhmm = d => pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  // Påskdagen enligt Gauss, för att kunna undanta skärtorsdag, långfredag
  // och annandag påsk från höglasttid.
  function easter(year) {
    const a = year % 19, b = Math.floor(year / 100), c = year % 100;
    const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
  }

  // Dagar som aldrig räknas som vardag i nättariffen.
  function isRedDay(d) {
    const m = d.getMonth(), day = d.getDate();
    if (m === 0 && (day === 1 || day === 6)) return true;              // nyårsdagen, trettondagen
    if (m === 11 && (day === 24 || day === 25 || day === 26 || day === 31)) return true;
    const e = easter(d.getFullYear()).getTime(), DAY = 24 * HOUR;
    const off = Math.round((new Date(d.getFullYear(), m, day).getTime() - e) / DAY);
    return off === -3 || off === -2 || off === 1;                      // skärtorsdag, långfredag, annandag
  }

  function isHighLoad(t) {
    const d = new Date(t);
    const winter = d.getMonth() >= 10 || d.getMonth() <= 2;            // nov–mars
    const weekday = d.getDay() >= 1 && d.getDay() <= 5;
    const daytime = d.getHours() >= 6 && d.getHours() < 22;
    return winter && weekday && daytime && !isRedDay(d);
  }

  // Spotpris i SEK/kWh exkl moms in, totalpris i kr/kWh inkl allt ut.
  const kr = (v, t) => {
    const grid = isHighLoad(t === undefined ? Date.now() : t) ? TARIFF.gridHigh : TARIFF.gridLow;
    const ore = v * 100 + TARIFF.markup + TARIFF.cert + TARIFF.energyTax + grid;
    return ore * TARIFF.vat / 100;
  };
  const sv = (v, d = 2) => v.toFixed(d).replace(".", ",");
  const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };

  // Referenspris för färgskalan: 3-månaderssnittet om det finns, annars
  // 30-dagarssnittet, annars fönstrets eget snitt.
  let colRef = 0;

  const col = k => {
    const ref = colRef || COLOR.fallback;
    const lo = ref * COLOR.low, hi = ref * COLOR.high;
    let h;
    if (k <= lo) h = 142;
    else if (k <= ref) h = 142 + (COLOR.midHue - 142) * (k - lo) / ((ref - lo) || 1);
    else if (k <= hi) h = COLOR.midHue * (1 - (k - ref) / ((hi - ref) || 1));
    else h = 0;
    return `hsl(${h.toFixed(0)} 74% 56%)`;
  };

  function icon(code, night) {
    if (code === 0) return night ? "🌙" : "☀️";
    if (code <= 2)  return night ? "🌙" : "🌤";
    if (code === 3) return "☁️";
    if (code <= 48) return "🌫";
    if (code <= 57) return "🌦";
    if (code <= 67) return "🌧";
    if (code <= 77) return "🌨";
    if (code <= 82) return "🌧";
    if (code <= 86) return "🌨";
    return "⛈";
  }

  function sunIcon(x, y, s, c) {
    let o = `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(s * 0.5).toFixed(1)}" fill="${c}"/>`;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      o += `<line x1="${(x + Math.cos(a) * s * 0.78).toFixed(1)}" y1="${(y + Math.sin(a) * s * 0.78).toFixed(1)}" x2="${(x + Math.cos(a) * s * 1.2).toFixed(1)}" y2="${(y + Math.sin(a) * s * 1.2).toFixed(1)}" stroke="${c}" stroke-width="${(s * 0.22).toFixed(2)}" stroke-linecap="round"/>`;
    }
    return o;
  }

  function moonIcon(x, y, s, c) {
    const r = s * 0.98;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${c}"/>`
      + `<circle cx="${(x + r * 0.52).toFixed(1)}" cy="${(y - r * 0.12).toFixed(1)}" r="${(r * 0.84).toFixed(1)}" fill="var(--bg)"/>`;
  }

  function uvColor(u) {
    if (u >= 8) return "#E24B4A";
    if (u >= 6) return "#F0782C";
    if (u >= 3) return "#EF9F27";
    return null;
  }

  function feelsLabel(i) {
    if (!wx.feels || wx.feels[i] === null || wx.feels[i] === undefined) return "&nbsp;";
    const t = Math.round(wx.temp[i]), f = Math.round(wx.feels[i]);
    return Math.abs(f - t) >= 1 ? `≈${f}°` : "&nbsp;";
  }

  // Mörker avgörs mot det dygn tidpunkten hör till, jämfört på tidsstämpel.
  // Indexräkning mot midnatt hade spårat ur vid sommartidsomställningen.
  function isNight(t) {
    if (!wx || !wx.rise || !wx.rise.length) return false;
    let d = 0;
    for (let i = 0; i < wx.rise.length; i++) if (t >= wx.rise[i].getTime()) d = i;
    const set = wx.set[d] || wx.set[wx.set.length - 1];
    return t < wx.rise[d].getTime() || t >= set.getTime();
  }

  function alignWeather() {
    const w = document.getElementById("chart").clientWidth;
    if (!w || !padPitch || !wxCols.length) return;
    const pitch2 = padPitch * WX_STEP;
    const n = wxCols.length;
    const pct = v => (Math.max(0, v) / w * 100).toFixed(3) + "%";
    document.getElementById("wxLab").style.width = pct(padFirstX - pitch2 / 2);
    document.getElementById("wxLab").style.paddingRight = pct(padPitch * 0.22);
    const grid = document.getElementById("wxGrid");
    grid.style.gridTemplateColumns = `repeat(${n},1fr)`;
    grid.style.paddingRight = "0";
    document.getElementById("wxSun").style.width = pct(w - padFirstX - pitch2 * (n - 0.5));
    const fit = pitch2 * 0.9 / (3 * 0.58);
    document.getElementById("wx").style.setProperty("--wxfs",
      Math.max(7, Math.min(fit, 18)).toFixed(1) + "px");
  }

  // Klockan och kvartstexten ska börja vid samma vänsterkant som prissiffran.
  // Prisets bredd beror på siffran, så kanten mäts fram i stället för att räknas ut.
  // Ramen ritas på uppskattad bredd och justeras sedan mot den faktiska texten,
  // så den sitter lika tätt oavsett siffra, och möter linjen i mitten.
  function fitNowLabel(container, xn, fs, W) {
    try {
      const tg = container.querySelector("#nowText");
      const rect = container.querySelector("#nowBox");
      const line = container.querySelector("#nowLine");
      const label = container.querySelector("#nowLabel");
      const bb = tg.getBBox();
      if (!bb.width) return;
      const padX = fs * 0.65, padY = fs * 0.32, sw = 1.8;
      const x = bb.x - padX, w = bb.width + padX * 2;
      const y = bb.y - padY, h = bb.height + padY * 2;
      let dx = xn - (x + w / 2);
      if (x + dx < sw) dx = sw - x;
      if (x + dx + w > W - sw) dx = W - sw - w - x;
      const dy = Math.max(0, sw - y);
      label.setAttribute("transform", `translate(${dx.toFixed(1)},${dy.toFixed(1)})`);
      rect.setAttribute("x", x.toFixed(1));
      rect.setAttribute("y", y.toFixed(1));
      rect.setAttribute("width", w.toFixed(1));
      rect.setAttribute("height", h.toFixed(1));
      line.setAttribute("y1", (y + h + dy).toFixed(1));
    } catch (e) { /* getBBox saknas – behåll den uppskattade ramen */ }
  }

  // Snittrutorna mäts in mot sin text och skjuts sedan i sidled så att kanten
  // hamnar mot ritytan. Kopplingsstrecket räknas om efter förskjutningen.
  function fitAvg(container, fs) {
    try {
      const marks = container.querySelectorAll ? container.querySelectorAll(".avgMark") : [];
      for (const g of marks) {
        const txt = g.querySelector(".avgText");
        const rect = g.querySelector(".avgBox");
        const conn = g.querySelector(".avgConn");
        const inner = g.querySelector(".avgLabel");
        const bb = txt.getBBox();
        if (!bb.width) continue;
        const padX = fs * 0.55, padY = fs * 0.32;
        const w = bb.width + padX * 2, h = bb.height + padY * 2;
        const x0 = bb.x - padX, y0 = bb.y - padY;
        const side = g.getAttribute("data-side"), edge = +g.getAttribute("data-edge");
        const dx = side === "left" ? (edge - 7) - (x0 + w) : (edge + 7) - x0;
        inner.setAttribute("transform", `translate(${dx.toFixed(1)},0)`);
        rect.setAttribute("x", x0.toFixed(1));
        rect.setAttribute("y", y0.toFixed(1));
        rect.setAttribute("width", w.toFixed(1));
        rect.setAttribute("height", h.toFixed(1));
        rect.setAttribute("rx", Math.min(h / 2, fs * 0.5).toFixed(1));
        const bx = x0 + dx;
        conn.setAttribute("x1", (side === "left" ? bx + w : edge).toFixed(1));
        conn.setAttribute("x2", (side === "left" ? edge : bx).toFixed(1));
      }
    } catch (e) { /* getBBox saknas – behåll de uppskattade rutorna */ }
  }

  function alignSlot(container) {
    try {
      const bb = container.querySelector("#curPrice").getBBox();
      if (!bb.width) return;
      for (const id of ["#curClock", "#curSlot"]) {
        const el = container.querySelector(id);
        if (!el) continue;
        el.setAttribute("x", bb.x.toFixed(1));
        el.setAttribute("text-anchor", "start");
      }
    } catch (e) { /* getBBox saknas – behåll centrerat */ }
  }

  function draw(fromResize) {
    if (!today && !tomorrow && !yesterday) return;
    const box = document.getElementById("chart");
    const W = Math.max(520, Math.round(box.clientWidth || 1000));
    const H = Math.max(180, Math.round(box.clientHeight || 420));
    if (fromResize && W === lastW && H === lastH) return;
    lastW = W; lastH = H;

    const fs = +(H * 0.042).toFixed(0);
    const pf = Math.round(fs * 2.0);
    const qf = Math.round(fs * 0.95);
    const wBox = Math.max("0,00 kr".length * pf * 0.55, "00:00–00:15".length * qf * 0.55) + fs * 1.2;
    const half = Math.round(wBox / 2) + 14;
    const L = Math.max(74, Math.round(fs * 5.3), half);
    const R = Math.max(18, Math.round(fs * 5.3), half);
    const T = Math.round(fs * 5.4);
    const B = Math.round(fs * 2.1);   // plats åt timsiffrorna

    // Fönstret börjar vid förra hela timmen, så den timme som just passerat
    // syns kvar till nästa hela timme slår. Kl 15:45 börjar det alltså 14:00.
    const t0 = Math.floor(Date.now() / HOUR) * HOUR - HOUR;
    const t1 = t0 + WIN_H * HOUR;

    const series = (yesterday || []).concat(today || [], tomorrow || [])
      .map(p => { const t = new Date(p.time_start).getTime(); return { t, v: kr(p.SEK_per_kWh, t), end: new Date(p.time_end).getTime() }; })
      .filter(p => p.end > t0 && p.t < t1)
      .sort((a, b) => a.t - b.t);

    if (!series.length) {
      document.getElementById("msg").textContent = "Inga priser för perioden";
      return;
    }
    setMsg();

    const v = series.map(p => p.v);
    const lo = Math.min(...v), hi = Math.max(...v);

    // Snitt, lägsta och högsta räknas per kalenderdygn på hela dygnets priser,
    // inte på det rullande fönstret.
    const vals = arr => arr && arr.length
      ? arr.map(p => kr(p.SEK_per_kWh, new Date(p.time_start).getTime())) : null;
    const dayStat = arr => {
      const a = vals(arr);
      if (!a) return null;
      return { lo: Math.min(...a), hi: Math.max(...a), avg: a.reduce((x, y) => x + y, 0) / a.length };
    };
    const dToday = dayStat(today);
    // Morgondagens siffror hör bara hit när morgondagen faktiskt syns i fönstret.
    const tomVisible = !!tomorrow && midnight() + 24 * HOUR < Math.floor(Date.now() / HOUR) * HOUR - HOUR + WIN_H * HOUR;
    const dTom = tomVisible ? dayStat(tomorrow) : null;
    const avgToday = dToday ? dToday.avg : null, avgTom = dTom ? dTom.avg : null;

    colRef = (hist && hist.d90) || (hist && hist.d30)
      || (dToday ? dToday.avg : v.reduce((a, b) => a + b, 0) / v.length);

    const spread = [lo, hi]
      .concat(dToday ? [dToday.lo, dToday.hi] : [])
      .concat(dTom ? [dTom.lo, dTom.hi] : [])
      .filter(x => x !== null);
    const y0 = Math.floor(Math.min(...spread) * 10) / 10;
    const yTop = Math.ceil(Math.max(...spread) * 10) / 10;
    const y1 = (yTop - y0 < 0.2) ? y0 + 0.2 : yTop;

    // hOff = timmar från fönstrets början
    const xAt = hOff => L + hOff * (W - L - R) / WIN_H;
    const xOf = t => xAt((t - t0) / HOUR);
    const Y = k => H - B - (k - y0) / (y1 - y0) * (H - T - B);

    let g = "";

    // Dygnets lägsta och högsta pris: idag till vänster, imorgon till höger.
    if (dToday) for (const k of [dToday.lo, dToday.hi]) {
      g += `<text x="${L - 10}" y="${(Y(k) + fs * 0.36).toFixed(1)}" fill="rgba(244,244,244,.45)" font-size="${fs}" text-anchor="end">${sv(k)} kr</text>`;
    }
    if (dTom) for (const k of [dTom.lo, dTom.hi]) {
      g += `<text x="${W - R + 10}" y="${(Y(k) + fs * 0.36).toFixed(1)}" fill="rgba(244,244,244,.45)" font-size="${fs}" text-anchor="start">${sv(k)} kr</text>`;
    }

    // dygnsskiftet delar fönstret i dagens och morgondagens snitt
    const nextMidnight = midnight() + 24 * HOUR;
    const xMid = Math.min(Math.max(xOf(nextMidnight), L), W - R);
    if (nextMidnight > t0 && nextMidnight < t1) {
      g += `<line x1="${xMid.toFixed(1)}" y1="${T}" x2="${xMid.toFixed(1)}" y2="${H - B}" stroke="#8a8a8a" stroke-width="${Math.max(3, fs * 0.22).toFixed(1)}" stroke-opacity=".55" stroke-linecap="round"/>`;
    }

    // Ett snitt per kalenderdygn: dagens etikett i vänstermarginalen, morgondagens
    // i högermarginalen, varje linje bara över sin egen del av fönstret.
    // Rutan ritas på uppskattad bredd och mäts sedan in mot texten i fitAvg,
    // på samma sätt som prisrutan. Radien matchar prisramens.
    const bh = Math.round(fs * 1.6);
    const avgMark = (val, xa, xb, c, side) => {
      if (val === null || xb - xa < 2) return "";
      const y = Y(val), lbl = `${sv(val)} kr`;
      const bw = Math.round(lbl.length * fs * 0.58 + fs * 1.1);
      const edge = side === "left" ? L : W - R;
      const bx = side === "left" ? edge - 7 - bw : edge + 7;
      const cx0 = side === "left" ? bx + bw : edge;
      const cx1 = side === "left" ? edge : bx;
      return `<g class="avgMark" data-side="${side}" data-edge="${edge.toFixed(1)}">`
        + `<line x1="${xa.toFixed(1)}" y1="${y.toFixed(1)}" x2="${xb.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="7 6" stroke-opacity=".9"/>`
        + `<line class="avgConn" x1="${cx0.toFixed(1)}" y1="${y.toFixed(1)}" x2="${cx1.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c}" stroke-width="1.5"/>`
        + `<g class="avgLabel">`
        + `<rect class="avgBox" x="${bx.toFixed(1)}" y="${(y - bh / 2).toFixed(1)}" width="${bw}" height="${bh}" rx="${(fs * 0.5).toFixed(1)}" fill="#000" stroke="${c}" stroke-width="1.3"/>`
        + `<text class="avgText" x="${(bx + bw / 2).toFixed(1)}" y="${(y + fs * 0.36).toFixed(1)}" fill="#f4f4f4" font-size="${fs}" text-anchor="middle">${lbl}</text>`
        + `</g></g>`;
    };
    g += avgMark(avgToday, L, xMid, "var(--ref)", "left");
    g += avgMark(avgTom, xMid, W - R, "var(--sunset)", "right");

    // priskurvan, ett färgat segment per intervall
    for (let i = 0; i < series.length - 1; i++) {
      g += `<line x1="${xOf(series[i].t).toFixed(1)}" y1="${Y(series[i].v).toFixed(1)}" x2="${xOf(series[i + 1].t).toFixed(1)}" y2="${Y(series[i + 1].v).toFixed(1)}" stroke="${col((series[i].v + series[i + 1].v) / 2)}" stroke-width="3" stroke-linecap="round"/>`;
    }

    // timetiketter och väderkolumner: hela klockslag inne i fönstret
    const firstHour = Math.ceil(t0 / HOUR) * HOUR;
    const hourTicks = [];
    for (let t = firstHour; t < t1; t += HOUR) hourTicks.push(t);

    padL = L; padR = R; padPitch = (W - L - R) / WIN_H;
    wxCols = [];
    for (const t of hourTicks) {
      const d = new Date(t);
      if (d.getHours() % WX_STEP) continue;
      if (!wxCols.length) padFirstX = xOf(t);
      wxCols.push(t);
      g += `<text x="${xOf(t).toFixed(1)}" y="${(H - fs * 0.35).toFixed(1)}" fill="rgba(244,244,244,.42)" font-size="${(fs * 1.5).toFixed(0)}" text-anchor="middle">${pad2(d.getHours())}</text>`;
    }


    // Historiska snitt uppe till höger
    if (hist) {
      const hf = Math.round(fs * 1.05);
      [["30 dagar", hist.d30], ["3 månader", hist.d90]].forEach(([lab, val], i) => {
        if (val === null) return;
        const y = T - fs * (2.5 - i * 1.5);
        g += `<text x="${(W - R).toFixed(1)}" y="${y.toFixed(1)}" font-size="${hf}" text-anchor="end">`
          + `<tspan fill="rgba(244,244,244,.45)">${lab} </tspan>`
          + `<tspan fill="#f4f4f4" font-weight="600">${sv(val)} kr</tspan></text>`;
      });
    }

    // Aktuell tid som röd linje, med priset i en röd ram fäst i linjen.
    const now = Date.now();
    const cur = series.find(p => p.t <= now && now < p.end) || series[0];
    const slot = `${hhmm(new Date(cur.t))}–${hhmm(new Date(cur.end))}`;
    const xn = Math.min(Math.max(xOf(now), L), W - R);
    const cx = Math.min(Math.max(xn, wBox / 2 + 2), W - wBox / 2 - 2);
    // Radavstånden räknas från teckenkanterna, inte baslinjerna, så luften
    // mellan klocka–pris och pris–kvart blir lika stor.
    const gap = fs * 0.25;
    const yQuarter = T - fs * 0.8;                       // kvartens baslinje
    const yPrice = yQuarter - qf * 0.71 - gap - pf * 0.22;
    const yClock = yPrice - pf * 0.72 - gap - qf * 0.19;
    const boxTop = yClock - qf * 0.71 - fs * 0.2, boxBot = T - fs * 0.45;

    // Linjen och ramen följer prisets färg, så hela markeringen skiftar
    // grön–gul–röd med nivån i stället för att alltid vara röd.
    const curCol = col(cur.v);
    g += `<line id="nowLine" x1="${xn.toFixed(1)}" y1="${boxBot.toFixed(1)}" x2="${xn.toFixed(1)}" y2="${H - B + 8}" stroke="${curCol}" stroke-width="1.8"/>`;
    g += `<g id="nowLabel">`
      + `<rect id="nowBox" x="${(cx - wBox / 2).toFixed(1)}" y="${boxTop.toFixed(1)}" width="${wBox.toFixed(1)}" height="${(boxBot - boxTop).toFixed(1)}" rx="${(fs * 0.5).toFixed(1)}" fill="#000" stroke="${curCol}" stroke-width="1.8"/>`
      + `<g id="nowText">`
      + `<text id="curClock" x="${cx.toFixed(1)}" y="${yClock.toFixed(1)}" fill="rgba(244,244,244,.5)" font-size="${qf}" text-anchor="middle">${hhmm(new Date(now))}</text>`
      + `<text id="curPrice" x="${cx.toFixed(1)}" y="${yPrice.toFixed(1)}" fill="${curCol}" font-size="${pf}" font-weight="600" text-anchor="middle">${sv(cur.v)}<tspan font-size="${Math.round(pf * 0.42)}" fill-opacity=".75"> kr</tspan></text>`
      + `<text id="curSlot" x="${cx.toFixed(1)}" y="${yQuarter.toFixed(1)}" fill="rgba(244,244,244,.5)" font-size="${qf}" text-anchor="middle">${slot}</text>`
      + `</g></g>`;

    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
    alignSlot(box);
    fitNowLabel(box, xn, fs, W);
    fitAvg(box, fs);
    drawWeather();
  }

  function drawWeather() {
    if (!wx || !wxCols.length) return;
    let html = "";
    const idxOf = t => wx.time ? wx.time.indexOf(t) : -1;
    for (const t of wxCols) {
      const i = idxOf(t);
      if (i < 0 || wx.temp[i] === undefined || wx.temp[i] === null) { html += "<div></div>"; continue; }
      const u = Math.round(wx.uv[i]);
      const c = uvColor(u);
      html += `<div${c ? ` style="color:${c};background:${c}1c"` : ""}>
        <div class="ic">${icon(wx.code[i], isNight(t))}</div>
        <div class="tp">${Math.round(wx.temp[i])}°</div>
        <div class="fl">${feelsLabel(i)}</div>
        <div class="sc">${wx.rain[i]}</div>
        <div class="sc">${Math.round(wx.wind[i])}</div>
        <div class="sc">${u}</div>
      </div>`;
    }
    document.getElementById("wxGrid").innerHTML = html;
    document.getElementById("wxLab").innerHTML =
      `<div class="ic">&nbsp;</div>
       <div class="tp">°C</div>
       <div class="fl">känns</div>
       <div class="sc">%</div>
       <div class="sc">m/s</div>
       <div class="sc">UV</div>`;
    // Nästa soluppgång och solnedgång, i utrymmet till höger om timkolumnerna.
    if (wx.rise) {
      const now = Date.now();
      const next = arr => arr.find(d => d.getTime() > now) || arr[arr.length - 1];
      const rows = [
        [next(wx.rise), "var(--sunrise)", "sun"],
        [next(wx.set), "var(--sunset)", "moon"]
      ];
      document.getElementById("wxSun").innerHTML = rows.map(([d, c, kind]) =>
        `<div style="color:${c}">`
        + `<svg viewBox="0 0 20 20" width="1.7em" height="1.7em" xmlns="http://www.w3.org/2000/svg">`
        + (kind === "sun" ? sunIcon(10, 10, 6, c) : moonIcon(10, 10, 6, c))
        + `</svg><span>${hhmm(d)}</span></div>`).join("");
    }

    alignWeather();
  }

  function priceUrl(d) {
    return `https://www.elprisetjustnu.se/api/v1/prices/${d.getFullYear()}/${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}_${ZONE}.json`;
  }

  async function fetchDay(d) {
    try {
      const r = await fetch(priceUrl(d), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      return Array.isArray(j) && j.length ? j : null;
    } catch (e) {
      return null;
    }
  }

  // Morgondagens priser publiceras tidigast kl 13. Innan dess svarar API:et 404
  // och fönstret slutar vid midnatt.
  async function loadPrices() {
    const now = new Date();
    today = await fetchDay(now);
    tomorrow = await fetchDay(new Date(Date.now() + 24 * HOUR));
    // Mellan 00:00 och 00:59 börjar fönstret klockan 23 igår, så gårdagens
    // sista timme behövs för att kurvan inte ska starta en timme in.
    yesterday = now.getHours() === 0 ? await fetchDay(new Date(Date.now() - 24 * HOUR)) : null;
    errPrice = (!today && !tomorrow) ? "Elpriset kunde inte hämtas" : "";
    setMsg();
    if (errPrice) return;
    draw();
  }

  const dayKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  // Cachen versioneras på tariffen, så ändrade avgifter inte ger gamla snitt.
  const tariffTag = Object.values(TARIFF).join("_");

  // Ett dygnssnitt per datum, cachat i localStorage. Historiska dygn ändras
  // aldrig, så efter första körningen behövs bara det senaste dygnet hämtas.
  async function dayAvg(d) {
    const key = `ep:${ZONE}:${tariffTag}:${dayKey(d)}`;
    try {
      const c = localStorage.getItem(key);
      if (c !== null) return +c;
    } catch (e) { /* localStorage blockerat */ }
    const j = await fetchDay(d);
    if (!j || !j.length) return null;
    // Höglast och låglast skiljer sig inom dygnet, så varje kvart räknas om
    // för sig innan snittet bildas.
    const a = j.reduce((x, p) => x + kr(p.SEK_per_kWh, new Date(p.time_start).getTime()), 0) / j.length;
    try { localStorage.setItem(key, String(a)); } catch (e) {}
    return a;
  }

  async function loadHistory() {
    const days = [];
    for (let i = 1; i <= HIST_DAYS; i++) days.push(new Date(Date.now() - i * 24 * HOUR));

    const raw = [];
    for (let i = 0; i < days.length; i += 6) {
      const chunk = await Promise.all(days.slice(i, i + 6).map(dayAvg));
      raw.push(...chunk);
    }

    const mean = arr => {
      const a = arr.filter(x => x !== null && x !== undefined && !isNaN(x));
      return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    };
    hist = { d30: mean(raw.slice(0, 30)), d90: mean(raw) };
    draw();
  }

  async function loadWeather() {
    const url = "https://api.open-meteo.com/v1/forecast"
      + `?latitude=${LAT}&longitude=${LON}`
      + "&hourly=temperature_2m,apparent_temperature,precipitation_probability,wind_speed_10m,uv_index,weather_code"
      + "&daily=sunrise,sunset&wind_speed_unit=ms&timezone=Europe%2FStockholm&forecast_days=2";
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      wx = {
        temp: j.hourly.temperature_2m,
        feels: j.hourly.apparent_temperature,
        rain: j.hourly.precipitation_probability,
        wind: j.hourly.wind_speed_10m,
        uv:   j.hourly.uv_index,
        code: j.hourly.weather_code,
        time: j.hourly.time.map(x => new Date(x).getTime()),
        rise: j.daily.sunrise.map(x => new Date(x)),
        set:  j.daily.sunset.map(x => new Date(x))
      };
      errWx = "";
      setMsg();
      draw();
    } catch (e) {
      errWx = "Vädret kunde inte hämtas";
      setMsg();
    }
  }

  // Layouten sätter sig i flera steg: väderraden och de historiska snitten
  // tillkommer efter första ritningen och ändrar diagrammets höjd, vilket i sin
  // tur ändrar fs och därmed sidmarginalerna. En ResizeObserver ritar om när det
  // händer, och storleksjämförelsen i draw() stoppar kedjan när den stabiliserat sig.
  const schedule = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; draw(true); });
  };
  window.addEventListener("resize", schedule);
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(schedule);
    ro.observe(document.getElementById("chart"));
    ro.observe(document.getElementById("wx"));
  }
  loadPrices();
  loadWeather();
  loadHistory();
  setInterval(draw, MS_DRAW);
  setInterval(loadPrices, MS_PRICE);
  setInterval(loadWeather, MS_WX);
  setInterval(loadHistory, 6 * 60 * 60 * 1000);
})();
</script>
</body>
</html>
